<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#7d8b8c" />
    <title>Cascadia Woods</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <div id="toast"></div>
    <div id="overlay">
      <div class="card">
        <h1>Cascadia Woods</h1>
        <div id="progress" role="progressbar" aria-label="Loading"><div id="progress-fill"></div></div>
        <p id="status"></p>
        <ul class="keys">
          <li><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk · <kbd>Shift</kbd> run · <kbd>Space</kbd> jump</li>
          <li>Mouse to look · <kbd>R</kbd> cycle weather · <kbd>H</kbd> toggle HUD · <kbd>Esc</kbd> pause</li>
        </ul>
        <ul class="touch-help">
          <li>Thumb down, slide up to walk, further to run</li>
          <li>Slide sideways to turn</li>
          <li><span class="chip">⤒</span> jump</li>
        </ul>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
